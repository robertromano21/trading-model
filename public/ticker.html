<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticker · Trading Model</title>
  <link rel="stylesheet" href="/paper2.css">
  <link rel="stylesheet" href="/ticker.css">
  <script src="/nav.js"></script>
  <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/ticker.js"></script>
  <script type="module" src="/live.js"></script>
  <script src="/analyst-scorecard.js" defer></script>
  <script type="module" src="/ticker-prob.js"></script>
  <link rel="stylesheet" href="/options.css">
  <script type="module" src="/options-ui.js"></script>
</head>
<body>
  <main class="ticker-page">
    <section class="quote-head">
      <div>
        <div class="title-row"><h1 id="symbol">–</h1><span id="exh-badge" class="exh-badge" hidden></span></div>
        <div id="name" class="muted"></div>
      </div>
      <div class="price-block">
        <span id="last" class="last">–</span>
        <span id="change"></span>
        <div id="quote-meta" class="muted"></div>
      </div>
      <div class="actions">
        <button type="button" id="buy" class="trade buy">Buy…</button>
        <button type="button" id="sell" class="trade sell">Sell…</button>
        <button type="button" id="ai-flag">AI flag</button>
      </div>
    </section>
    <p id="data-banner" class="banner" hidden></p>
    <section class="toolbar">
      <div class="group" id="tf">
        <button type="button" data-tf="1m">1 min</button><button type="button" data-tf="5m">5 min</button><button type="button" data-tf="1h" hidden>1 hour</button><button type="button" data-tf="1d" class="on">Daily</button>
      </div>
      <label>Range <select id="range"></select></label>
      <details class="menu"><summary>Overlays</summary><div id="overlays"></div></details>
      <details class="menu"><summary>Panes</summary><div id="panes"></div></details>
      <label><input type="checkbox" id="live" checked> Live updates</label>
      <span id="quote-live-state" class="muted"></span>
    </section>
    <div class="layout">
      <div class="chart-col">
        <div id="chart"></div>
        <p class="muted small" id="chart-note"></p>
        <p class="muted small">Charts: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts</a> (Apache-2.0, vendored locally).</p>
      </div>
      <aside class="side">
        <section class="box"><h2>Indicators (engine definitions)</h2><table id="ind"></table></section>
        <section class="box"><h2>AI verdict</h2><div id="verdict" class="muted">Loading…</div>
          <p id="verdict-status" class="small muted" role="status" hidden></p>
          <button type="button" id="verdict-refresh" hidden>Generate AI verdict</button>
          <form id="ask-form" class="ask"><input id="ask" placeholder="Ask the AI about this ticker…" autocomplete="off"><button type="submit">Ask</button></form>
          <div id="answer" class="answer"></div>
        </section>
        <section class="box"><h2>Paper trading</h2><div id="paper" class="muted">–</div></section>
        <section class="box"><h2>Data quality</h2><div id="flags" class="muted">–</div></section>
      </aside>
    </div>
    <section class="box" id="ticker-scorecard-host"><h2>Analyst track record</h2></section>
    <section class="box" id="prob-forecast"><h2>Walk-forward probabilities</h2><div id="prob-body" class="muted">Loading…</div></section>
    <section class="box"><h2>Fundamentals</h2><div id="fundamentals" class="muted">Loading…</div></section>
    <section class="box"><h2>News &amp; press releases</h2><ul id="news" class="news"></ul></section>
  </main>
</body>
</html>
